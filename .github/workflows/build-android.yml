# Reusable build: the signed Android APK for one release channel, built in the Dockerfile and packaged for the
# publish step. Called by the unstable, canary and stable workflows. Nothing is published from here.
# The keystore comes from two secrets. Losing or changing the keystore stops every installed copy from updating,
# so keep a backup of ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PROPERTIES somewhere safe.
name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      channel:
        description: stable, canary or unstable
        required: true
        default: unstable
        type: choice
        options: [unstable, canary, stable]
  workflow_call:
    inputs:
      channel:
        description: stable, canary or unstable
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-22.04
    # The image builds the SDK, the NDK and the Rust toolchain from scratch, so the first run is slow.
    timeout-minutes: 120
    env:
      CHANNEL: ${{ inputs.channel }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Write the signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
        run: |
          set -eu
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PROPERTIES" ]; then
            echo "::error title=Signing::ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PROPERTIES must be set."
            exit 1
          fi
          # Outside the checkout, so the keystore is never inside the build context.
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/signing/android_keystore"
          printf '%s\n' "$KEYSTORE_PROPERTIES" > "$RUNNER_TEMP/signing/android_keystore_properties"
          chmod 600 "$RUNNER_TEMP/signing/"*

      - name: Pull the Android environment and dependencies
        run: |
          # The environment and the dependencies are published by build-images.yml, so this only downloads them.
          set -eu
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          eval "$(scripts/release/image-tags.sh android)"
          docker pull "$DEPS"
          echo "DEPS=$DEPS" >> "$GITHUB_ENV"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build the signed APK
        run: |
          # The Dockerfile builds the release APK of this channel and signs it, because both secrets are given.
          docker buildx build \
            -f docker/android/Dockerfile \
            --build-arg "DEPS_IMAGE=$DEPS" \
            --build-arg "CHANNEL=$CHANNEL" \
            --build-arg "GITHUB_RUN_NUMBER=$GITHUB_RUN_NUMBER" \
            --build-arg "GITHUB_SHA=$GITHUB_SHA" \
            --secret "id=android_keystore,src=$RUNNER_TEMP/signing/android_keystore" \
            --secret "id=android_keystore_properties,src=$RUNNER_TEMP/signing/android_keystore_properties" \
            --output type=local,dest=dist/android-build \
            .

      - name: Check the APK is signed
        run: |
          apk="$(find dist/android-build -name '*.apk' | head -n 1)"
          if [ -z "$apk" ]; then
            echo "::error title=Build::No APK was produced."
            exit 1
          fi
          case "$apk" in
            *unsigned*) echo "::error title=Signing::The APK is unsigned: $apk"; exit 1 ;;
          esac
          python3 scripts/release/check-android-signature.py "$apk"

      - name: Package the APK
        run: node scripts/release/package-android.mjs

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ inputs.channel }}
          path: dist/android/${{ inputs.channel }}/
          if-no-files-found: error
          retention-days: 30
