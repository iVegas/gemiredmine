# Reusable build: the Flatpak bundle for one release channel. The bundle is built and smoke-tested in the Flatpak
# environment image (docker/flatpak/env.Dockerfile), which is pulled, so the runner installs nothing for the build.
# Called by the unstable, canary and stable workflows. Nothing is published from here.
name: Build Linux Flatpak

on:
  workflow_dispatch:
    inputs:
      channel:
        description: stable, canary, unstable or dev
        required: true
        default: unstable
        type: choice
        options: [unstable, canary, stable, dev]
  workflow_call:
    inputs:
      channel:
        description: stable, canary, unstable or dev
        required: true
        type: string
      commit:
        description: Commit to build. Empty builds the commit that started the run.
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CHANNEL: ${{ inputs.channel }}
      RELEASE_COMMIT: ${{ inputs.commit || github.sha }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}

      - name: Pull the Flatpak environment
        run: |
          set -eu
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          eval "$(scripts/release/image-tags.sh flatpak)"
          docker pull "$ENV"
          echo "ENV=$ENV" >> "$GITHUB_ENV"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build the Flatpak bundle
        run: |
          # flatpak-builder needs namespaces and a sandbox, so the container runs privileged. It holds the build only.
          docker run --rm --privileged \
            -v "$PWD:/work" \
            -e CHANNEL -e GITHUB_RUN_NUMBER -e GITHUB_SHA="$RELEASE_COMMIT" \
            "$ENV" scripts/release/flatpak-build.sh

      - name: Package the bundle
        run: GITHUB_SHA="$RELEASE_COMMIT" node scripts/release/package-flatpak.mjs

      - name: Smoke test the installed app on Wayland
        run: |
          docker run --rm --privileged -v "$PWD:/work" \
            "$ENV" scripts/release/smoke-test-flatpak.sh "/work/dist/flatpak/${CHANNEL}/bundle.flatpak"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ inputs.channel }}
          path: dist/linux/${{ inputs.channel }}/
          if-no-files-found: error
          retention-days: 30
