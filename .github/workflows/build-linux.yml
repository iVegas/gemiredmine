# Reusable build: tests, type check, Electrobun build and AppImage for one release channel.
# Called by the unstable, canary and stable workflows. Nothing is published from here.
name: Build Linux AppImage

on:
  # Runs from the Actions tab for a build-only check (no publishing), for example before a merge.
  workflow_dispatch:
    inputs:
      channel:
        description: stable, canary or unstable
        required: true
        default: unstable
        type: choice
        options: [unstable, canary, stable]
  workflow_call:
    inputs:
      channel:
        description: stable, canary or unstable
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CHANNEL: ${{ inputs.channel }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        env:
          HUSKY: '0'
        run: npm ci

      - name: Test
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Build webview
        run: npm run build

      - name: Build Electrobun app
        run: npm run build:electrobun

      - name: Install AppImage update tools
        run: sudo apt-get update && sudo apt-get install -y zsync

      - name: Package AppImage
        run: node scripts/release/package-linux.mjs

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ inputs.channel }}
          path: dist/linux/${{ inputs.channel }}/
          if-no-files-found: error
          retention-days: 30
