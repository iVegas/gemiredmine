# Reusable build: Tauri Windows build and signed MSIX for one release channel.
# Called by the unstable, canary and stable workflows. Nothing is published from here.
# Release packages must be signed, so the signing secrets are required.
name: Build Windows package

on:
  # Runs from the Actions tab for a build-only check (no publishing), for example before a merge.
  workflow_dispatch:
    inputs:
      channel:
        description: stable, canary or unstable
        required: true
        default: unstable
        type: choice
        options: [unstable, canary, stable]
      signing:
        description: self-signed (canary, unstable) or trusted (stable)
        required: true
        default: self-signed
        type: choice
        options: [self-signed, trusted]
  workflow_call:
    inputs:
      channel:
        description: stable, canary or unstable
        required: true
        type: string
      signing:
        description: self-signed (canary, unstable) or trusted (stable)
        required: true
        type: string
      commit:
        description: Commit to build. Empty builds the commit that started the run.
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      CHANNEL: ${{ inputs.channel }}
      TARGET_PLATFORM: windows
      REQUIRE_SIGNING: '1'
      WINDOWS_SIGNING: ${{ inputs.signing }}
      RELEASE_COMMIT: ${{ inputs.commit || github.sha }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        env:
          HUSKY: '0'
        run: npm ci

      - name: Install Rust
        # The same version as rust-toolchain.toml, which tauri-setup.test.ts checks.
        run: rustup toolchain install 1.99.0 --profile minimal --no-self-update

      - name: Cache Rust build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          # Per channel: the channels build different feature sets (developer tools), so they share no objects.
          key: rust-${{ runner.os }}-${{ inputs.channel }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ inputs.channel }}-

      # Builds the web assets first (the Tauri config's beforeBuildCommand), then the executable.
      - name: Build desktop app
        run: npm run build:desktop

      - name: Check the executable
        run: node scripts/release/check-windows-binary.mjs

      - name: Smoke test the executable
        env:
          GEMIREDMINE_DATA_DIR: ${{ runner.temp }}\smoke-data
        run: |
          # Starts the app with nothing installed next to it. It has to still be running after 20 seconds.
          $name = node --input-type=module -e "import { CHANNELS } from './scripts/release/channels.mjs'; console.log(CHANNELS[process.env.CHANNEL].appName)"
          $process = Start-Process -FilePath "src-tauri\target\release\$name.exe" -PassThru
          Start-Sleep -Seconds 20
          $process.Refresh()
          if ($process.HasExited) {
            Write-Output "::error title=Smoke test::The app exited with code $($process.ExitCode) within 20 seconds."
            exit 1
          }
          Stop-Process -Id $process.Id -Force

      - name: Package and sign MSIX
        env:
          WINDOWS_SELF_SIGNED_PFX_BASE64: ${{ secrets.WINDOWS_SELF_SIGNED_PFX_BASE64 }}
          WINDOWS_SELF_SIGNED_PASSWORD: ${{ secrets.WINDOWS_SELF_SIGNED_PASSWORD }}
          WINDOWS_SELF_SIGNED_PUBLISHER: ${{ secrets.WINDOWS_SELF_SIGNED_PUBLISHER }}
          WINDOWS_TRUSTED_PFX_BASE64: ${{ secrets.WINDOWS_TRUSTED_PFX_BASE64 }}
          WINDOWS_TRUSTED_PASSWORD: ${{ secrets.WINDOWS_TRUSTED_PASSWORD }}
          WINDOWS_TRUSTED_PUBLISHER: ${{ secrets.WINDOWS_TRUSTED_PUBLISHER }}
        run: |
          $env:GITHUB_SHA = $env:RELEASE_COMMIT
          node scripts/release/package-windows.mjs

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ inputs.channel }}
          path: dist/windows/${{ inputs.channel }}/
          if-no-files-found: error
          retention-days: 30
