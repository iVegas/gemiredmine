# Reusable build: Electrobun Windows build and signed MSIX for one release channel.
# Called by the unstable, canary and stable workflows. Nothing is published from here.
# Release packages must be signed, so the signing secrets are required.
name: Build Windows package

on:
  # Runs from the Actions tab for a build-only check (no publishing), for example before a merge.
  workflow_dispatch:
    inputs:
      channel:
        description: stable, canary or unstable
        required: true
        default: unstable
        type: choice
        options: [unstable, canary, stable]
      signing:
        description: self-signed (canary, unstable) or trusted (stable)
        required: true
        default: self-signed
        type: choice
        options: [self-signed, trusted]
  workflow_call:
    inputs:
      channel:
        description: stable, canary or unstable
        required: true
        type: string
      signing:
        description: self-signed (canary, unstable) or trusted (stable)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      CHANNEL: ${{ inputs.channel }}
      TARGET_PLATFORM: windows
      REQUIRE_SIGNING: '1'
      WINDOWS_SIGNING: ${{ inputs.signing }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Check signing secrets
        shell: bash
        env:
          WINDOWS_SELF_SIGNED_PFX_BASE64: ${{ secrets.WINDOWS_SELF_SIGNED_PFX_BASE64 }}
          WINDOWS_SELF_SIGNED_PASSWORD: ${{ secrets.WINDOWS_SELF_SIGNED_PASSWORD }}
          WINDOWS_SELF_SIGNED_PUBLISHER: ${{ secrets.WINDOWS_SELF_SIGNED_PUBLISHER }}
          WINDOWS_TRUSTED_PFX_BASE64: ${{ secrets.WINDOWS_TRUSTED_PFX_BASE64 }}
          WINDOWS_TRUSTED_PASSWORD: ${{ secrets.WINDOWS_TRUSTED_PASSWORD }}
          WINDOWS_TRUSTED_PUBLISHER: ${{ secrets.WINDOWS_TRUSTED_PUBLISHER }}
        run: |
          # Fail before the slow build steps when the secrets for this signing profile are not set.
          case "$WINDOWS_SIGNING" in
            self-signed) required="WINDOWS_SELF_SIGNED_PFX_BASE64 WINDOWS_SELF_SIGNED_PASSWORD" ;;
            trusted) required="WINDOWS_TRUSTED_PFX_BASE64 WINDOWS_TRUSTED_PASSWORD WINDOWS_TRUSTED_PUBLISHER" ;;
            *) echo "::error::Unknown signing profile '$WINDOWS_SIGNING'"; exit 1 ;;
          esac
          missing=""
          for name in $required; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Windows signing secrets missing::Set these repository secrets for the $WINDOWS_SIGNING profile:$missing. See RELEASE_POLICY.md, 'Signing secrets (Windows)'."
            exit 1
          fi
          echo "All secrets for the $WINDOWS_SIGNING profile are set."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        env:
          HUSKY: '0'
        run: npm ci

      - name: Build webview
        run: npm run build

      - name: Build Electrobun app
        run: npm run build:electrobun

      - name: Package and sign MSIX
        env:
          WINDOWS_SELF_SIGNED_PFX_BASE64: ${{ secrets.WINDOWS_SELF_SIGNED_PFX_BASE64 }}
          WINDOWS_SELF_SIGNED_PASSWORD: ${{ secrets.WINDOWS_SELF_SIGNED_PASSWORD }}
          WINDOWS_SELF_SIGNED_PUBLISHER: ${{ secrets.WINDOWS_SELF_SIGNED_PUBLISHER }}
          WINDOWS_TRUSTED_PFX_BASE64: ${{ secrets.WINDOWS_TRUSTED_PFX_BASE64 }}
          WINDOWS_TRUSTED_PASSWORD: ${{ secrets.WINDOWS_TRUSTED_PASSWORD }}
          WINDOWS_TRUSTED_PUBLISHER: ${{ secrets.WINDOWS_TRUSTED_PUBLISHER }}
        run: node scripts/release/package-windows.mjs

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ inputs.channel }}
          path: dist/windows/${{ inputs.channel }}/
          if-no-files-found: error
          retention-days: 30
