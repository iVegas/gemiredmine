# Canary channel: a manually started release candidate for Linux, Windows and Android.
# The form chooses the version. next-rc keeps the version in package.json and takes the next rc number; next-patch,
# next-minor and next-major raise that version first and start at rc.1; manual uses manual_version. The prepare job
# writes the version into package.json, checks it against the channel policy, and commits and pushes it to the branch
# this run started from. The builds then check out that commit, and the release tag points at it.
name: Canary

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: >-
          next-rc: the version in package.json with the next release-candidate number.
          next-patch, next-minor, next-major: the next version up, starting at rc.1.
          manual: the version typed in manual_version.
        required: true
        default: next-rc
        type: choice
        options: [next-rc, next-patch, next-minor, next-major, manual]
      manual_version:
        description: Only for manual, for example 1.1.0-rc.1. Ignored otherwise.
        required: false
        type: string

concurrency:
  group: release-canary
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE: ${{ inputs.candidate }}
      MANUAL_VERSION: ${{ inputs.manual_version }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set the candidate version and check it against the channel policy
        id: version
        run: node scripts/release/publish.mjs bump-candidate --candidate "$CANDIDATE" --manual-version "$MANUAL_VERSION" --branch "$GITHUB_REF_NAME"

      - name: Commit and push the version
        id: commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          if git diff --cached --quiet; then
            echo "package.json already has $VERSION, so there is nothing to commit."
          else
            git commit -m "chore(release): canary $VERSION"
            # Pushed before the builds start, so each build checks out this commit and the tag points at it.
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: prepare
    uses: ./.github/workflows/build-linux.yml
    with:
      channel: canary
      commit: ${{ needs.prepare.outputs.commit }}

  build-windows:
    needs: prepare
    uses: ./.github/workflows/build-windows.yml
    with:
      channel: canary
      signing: self-signed
      commit: ${{ needs.prepare.outputs.commit }}
    secrets: inherit

  build-android:
    needs: prepare
    uses: ./.github/workflows/build-android.yml
    with:
      channel: canary
      commit: ${{ needs.prepare.outputs.commit }}
    secrets: inherit

  publish:
    needs: [build-linux, build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Download Linux package
        uses: actions/download-artifact@v8
        with:
          name: linux-canary
          path: dist/linux/canary

      - name: Download Windows package
        uses: actions/download-artifact@v8
        with:
          name: windows-canary
          path: dist/windows/canary

      - name: Download Android package
        uses: actions/download-artifact@v8
        with:
          name: android-canary
          path: dist/android/canary

      - name: Publish canary release and prune
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/publish.mjs publish --dir dist/linux/canary --dir dist/windows/canary --dir dist/android/canary
