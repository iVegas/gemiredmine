# Canary channel: a manually started release candidate for Linux and Windows. The version in
# package.json must be a release candidate (for example 1.0.0-rc.1) and newer than the latest stable release.
name: Canary

on:
  workflow_dispatch:

concurrency:
  group: release-canary
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check the candidate version against the channel policy
        run: node scripts/release/publish.mjs validate --channel canary --branch "$GITHUB_REF_NAME"

  build-linux:
    needs: validate
    uses: ./.github/workflows/build-linux.yml
    with:
      channel: canary

  build-windows:
    needs: validate
    uses: ./.github/workflows/build-windows.yml
    with:
      channel: canary
      signing: self-signed
    secrets: inherit

  build-android:
    needs: validate
    uses: ./.github/workflows/build-android.yml
    with:
      channel: canary
    secrets: inherit

  publish:
    needs: [build-linux, build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Download Linux package
        uses: actions/download-artifact@v8
        with:
          name: linux-canary
          path: dist/linux/canary

      - name: Download Windows package
        uses: actions/download-artifact@v8
        with:
          name: windows-canary
          path: dist/windows/canary

      - name: Download Android package
        uses: actions/download-artifact@v8
        with:
          name: android-canary
          path: dist/android/canary

      - name: Publish canary release and prune
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/publish.mjs publish --dir dist/linux/canary --dir dist/windows/canary --dir dist/android/canary
