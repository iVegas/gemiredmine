# Unstable channel: every push to main builds new unstable packages for Linux and Windows. The three
# newest builds are kept as releases; older ones are removed by the publish step.
name: Unstable

on:
  push:
    branches:
      - main

concurrency:
  group: release-unstable
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  # The builds pull the images that build-images.yml pushes for this commit. Both start on the same push, so the
  # builds wait here until that image run has finished, and stop if it failed.
  await-images:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Wait for the image build of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/await-image-build.mjs "$GITHUB_SHA"

  build-linux:
    needs: await-images
    uses: ./.github/workflows/build-linux.yml
    with:
      channel: unstable

  build-windows:
    needs: await-images
    uses: ./.github/workflows/build-windows.yml
    with:
      channel: unstable
      signing: self-signed
    secrets: inherit

  build-android:
    needs: await-images
    uses: ./.github/workflows/build-android.yml
    with:
      channel: unstable
    secrets: inherit

  publish:
    needs: [build-linux, build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Download Linux package
        uses: actions/download-artifact@v8
        with:
          name: linux-unstable
          path: dist/linux/unstable

      - name: Download Windows package
        uses: actions/download-artifact@v8
        with:
          name: windows-unstable
          path: dist/windows/unstable

      - name: Download Android package
        uses: actions/download-artifact@v8
        with:
          name: android-unstable
          path: dist/android/unstable

      - name: Publish unstable release and prune old builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/publish.mjs publish --dir dist/linux/unstable --dir dist/windows/unstable --dir dist/android/unstable
