# Unstable channel: every push to main builds new unstable packages for Linux and Windows. The three
# newest builds are kept as releases; older ones are removed by the publish step.
name: Unstable

on:
  push:
    branches:
      - main

concurrency:
  group: release-unstable
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-linux:
    uses: ./.github/workflows/build-linux.yml
    with:
      channel: unstable

  build-windows:
    uses: ./.github/workflows/build-windows.yml
    with:
      channel: unstable
      signing: self-signed
    secrets: inherit

  publish:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Download Linux package
        uses: actions/download-artifact@v8
        with:
          name: linux-unstable
          path: dist/linux/unstable

      - name: Download Windows package
        uses: actions/download-artifact@v8
        with:
          name: windows-unstable
          path: dist/windows/unstable

      - name: Publish unstable release and prune old builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/publish.mjs publish --dir dist/linux/unstable --dir dist/windows/unstable
