name: Checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        env:
          HUSKY: '0'
        run: npm ci

      - name: Test
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Build webview
        run: npm run build

  # The Rust crate is only wiring, but its unit tests and lints still need to run. It builds on the oldest
  # supported system, like the release build.
  rust:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        env:
          HUSKY: '0'
        run: npm ci

      # The crate embeds the web assets, so they have to exist before it compiles.
      - name: Build webview
        run: npm run build

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust
        # The same version as rust-toolchain.toml, which tauri-setup.test.ts checks.
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt --no-self-update

      - name: Cache Rust build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: rust-checks-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}
          restore-keys: |
            rust-checks-${{ runner.os }}-

      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib
