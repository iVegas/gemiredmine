# Stable channel: a manually started release from main for Linux and Windows. Only the two newest
# stable releases are kept, and canary builds that are no longer newer than the new stable are removed.
name: Stable

on:
  workflow_dispatch:

concurrency:
  group: release-stable
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check the release version against the channel policy
        run: node scripts/release/publish.mjs validate --channel stable --branch "$GITHUB_REF_NAME"

  build-linux:
    needs: validate
    uses: ./.github/workflows/build-linux.yml
    with:
      channel: stable

  build-windows:
    needs: validate
    uses: ./.github/workflows/build-windows.yml
    with:
      channel: stable
      signing: trusted
    secrets: inherit

  build-android:
    needs: validate
    uses: ./.github/workflows/build-android.yml
    with:
      channel: stable
    secrets: inherit

  publish:
    needs: [build-linux, build-windows, build-android]
    runs-on: ubuntu-latest
    # Attach required reviewers to this environment in the repository settings to approve each release.
    environment: stable-release
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Download Linux package
        uses: actions/download-artifact@v8
        with:
          name: linux-stable
          path: dist/linux/stable

      - name: Download Windows package
        uses: actions/download-artifact@v8
        with:
          name: windows-stable
          path: dist/windows/stable

      - name: Download Android package
        uses: actions/download-artifact@v8
        with:
          name: android-stable
          path: dist/android/stable

      - name: Publish stable release and prune
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/publish.mjs publish --dir dist/linux/stable --dir dist/windows/stable --dir dist/android/stable
