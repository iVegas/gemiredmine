[package]
name = "gemiredmine"
version = "0.0.0"
description = "Gemiredmine desktop shell. The version shipped to users comes from package.json."
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "gemiredmine_lib"
# staticlib and cdylib are what the Android build links later.
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.7.3", features = [] }

[dependencies]
tauri = { version = "~2.12.4", features = [] }
tauri-plugin-fs = "~2.7.1"
tauri-plugin-opener = "~2.7.2"
# No cookie jar (the API key travels in a header). Native roots, so a Redmine server behind
# a private CA that the OS trusts works. gzip because Redmine compresses large lists.
tauri-plugin-http = { version = "~2.8.3", default-features = false, features = [
  "rustls-tls-native-roots",
  "http2",
  "charset",
  "system-proxy",
  "gzip",
] }
serde = { version = "1", features = ["derive"] }

[features]
# Developer tools in the webview. The build script enables it for every channel except stable.
devtools = ["tauri/devtools"]

[profile.release]
# The desktop binary is shipped inside an AppImage and an MSIX, so size matters more than build time.
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
