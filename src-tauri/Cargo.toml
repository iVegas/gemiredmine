[package]
name = "gemiredmine"
version = "0.0.0"
description = "Gemiredmine desktop shell. The version shipped to users comes from package.json."
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "gemiredmine_lib"
# staticlib and cdylib are what the Android build links later.
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.7.3", features = [] }

[dependencies]
tauri = { version = "~2.12.4", features = [] }
tauri-plugin-fs = "~2.7.1"
tauri-plugin-opener = "~2.7.2"
# The app's own database (src/bun/storage). SQLite is built in, so nothing has to be installed next to the app.
tauri-plugin-sql = { version = "~2.5.0", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
# The API keys of the user's servers go in the system's credential store (src/credentials.rs). The stores are
# separate crates, one per system; the other systems have none yet.
keyring-core = "~1.0.1"

# No cookie jar (the API key travels in a header). gzip because Redmine compresses large lists.
# The trust roots differ by platform, one feature each (the two blocks below cover every target):
# - Desktop: the OS trust store, so a Redmine server behind a private CA that the OS trusts works.
# - Android: no system store is at the paths the native loader reads, so every HTTPS request failed
#   with "error sending request". The bundled Mozilla roots cover public CAs there.
[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-http = { version = "~2.8.3", default-features = false, features = [
  "rustls-tls-native-roots",
  "http2",
  "charset",
  "system-proxy",
  "gzip",
] }

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-http = { version = "~2.8.3", default-features = false, features = [
  "rustls-tls-webpki-roots",
  "http2",
  "charset",
  "system-proxy",
  "gzip",
] }

# Only one copy of the app runs per channel; a second one brings the first to the front and ends.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "~2.5.4"

# Read the state of the mouse buttons, which Tauri has no API for (src/pointer.rs).
[target.'cfg(target_os = "linux")'.dependencies]
gdk = "0.18"
gtk = "0.18"
# The Secret Service (GNOME Keyring, KDE Wallet), through D-Bus, in Rust only: no library to install.
zbus-secret-service-keyring-store = { version = "~1.0.1", features = ["crypto-rust"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
# Windows Credential Manager.
windows-native-keyring-store = "~1.1.0"

[features]
# Developer tools in the webview. The build script enables it for every channel except stable.
devtools = ["tauri/devtools"]

[profile.release]
# The desktop binary is shipped inside a Flatpak and an MSIX, so size matters more than build time.
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
